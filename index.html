<!--
THESIS: A personal collection where the pleasure is pulling a drawer and finding queueing theory filed beside memory research; it refuses the reading-app arrangement of a left-rail contents list beside a cream essay column.
OWN-WORLD: Walnut cabinetwork with flush drawers and brass hairline fittings, baize-green linings that only show when a drawer is open, authored specimen plates per growth area, and one warm ivory reading table that is the only light surface in the room.
STORY: She sees what arrived and what is due for a condition check, pulls a drawer, and it comes to rest on the table at reading width; she sets the extent, drills any specimen name into its catalogue entry, and files it for the next round.
FIRST VIEWPORT: Brass rail across the head; a glass vitrine of three unequal bays holding rounds due, latest accession, and where she stopped; beneath it the cabinet wall of flush drawers of unequal depth, the newest standing half-open on their baize.
FORM: Cabinet of curiosities, candidate 7 of the grounded list, seed key 4781c692.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->

<a class="skip" href="#stage">Skip to the collection</a>

<div class="room" id="room">
  <header class="rail">
    <div class="rail-mark">
      <span class="rail-title">Knowledge Cabinet</span>
      <span class="rail-sub" id="railSub">private collection</span>
    </div>
    <nav class="rail-cases" aria-label="Cases">
      <button class="plate" data-view="case" aria-current="true">Cabinet</button>
      <button class="plate" data-view="catalogue">Catalogue</button>
      <button class="plate" data-view="rounds">Rounds<span class="plate-count" id="dueBadge" hidden></span></button>
      <button class="plate" data-view="clippings">Clippings</button>
      <button class="plate" data-view="register">Register</button>
    </nav>
    <div class="rail-tools">
      <button class="tool" id="randomBtn" title="Open a drawer at random">
        <svg class="ic"><use href="#i-die"></use></svg><span>Random</span>
      </button>
      <button class="tool" id="lampBtn" title="Raise the lamp: brightens the room and lifts cabinet text for longer sessions" aria-pressed="false">
        <svg class="ic"><use href="#i-lamp"></use></svg><span id="lampLabel">Lamp up</span>
      </button>
    </div>
  </header>

  <main id="stage" tabindex="-1">
    <section class="view" id="view-case" data-view="case"></section>
    <section class="view" id="view-table" data-view="table" hidden></section>
    <section class="view" id="view-catalogue" data-view="catalogue" hidden></section>
    <section class="view" id="view-rounds" data-view="rounds" hidden></section>
    <section class="view" id="view-clippings" data-view="clippings" hidden></section>
    <section class="view" id="view-clipreader" data-view="clipreader" hidden></section>
    <section class="view" id="view-register" data-view="register" hidden></section>
  </main>
</div>

<div class="loupe" id="loupe" hidden role="toolbar" aria-label="Selection actions">
  <button data-act="drill"><svg class="ic"><use href="#i-loupe"></use></svg>Drill down</button>
  <button data-act="round"><svg class="ic"><use href="#i-pin"></use></svg>Add to rounds</button>
</div>

<aside class="slip" id="slip" hidden aria-label="Catalogue entry" role="dialog" aria-modal="true"></aside>
<div class="slip-veil" id="slipVeil" hidden></div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="content.js" defer></script>
<script src="figures.js" defer></script>
<script src="clippings.js" defer></script>
<script src="app.js" defer></script>
<script>
/* Offline shell. Service workers need a secure context, so this is a no-op on
   plain http — the book still works, it just is not installable there. */
if ('serviceWorker' in navigator && window.isSecureContext) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
